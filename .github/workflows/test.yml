name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 只在公开库跑。本账号私有仓库的 Actions 额度已用尽（2026-11-22 实测）：
    # 私有库里的 job 会以 steps=0 直接失败，每次 push 白留一条红叉，还照样计费。
    # 公开库 Actions 免费，且内容是私有库 HEAD 的逐字节快照，验证价值等价。
    # 额度恢复后删掉这一行，私有库就会跟着跑。
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 规则内核 35 条 + 整场经济模拟 5 条，无依赖、不需要 npm install
      - name: 规则内核与整场模拟单测
        run: npm test

      # 这条单测和探针都抓不到：它们读本地文件，感受不到 SW 缓存
      - name: 版本号三处一致（index.html / sw.js / version.json）
        run: npm run check:version

      # 公开库是只读镜像：私有发布脚本、探针产物都不该出现在这里。
      # 上面已把 job 限定在公开库，这里不再重复判断。
      - name: 公库完整性自检（不该出现发布脚本与探针产物）
        run: |
          fail=0
          for p in tools/publish-public.sh tmp-shots .probe-profile .workbuddy; do
            if [ -e "$p" ]; then
              echo "::error::$p 不该出现在公库（它只存在于私有库，或属于探针产物）"
              fail=1
            fi
          done
          if [ -e LICENSE ]; then echo "✓ LICENSE 在位"; else echo "::warning::公库缺少 LICENSE"; fi
          exit $fail
